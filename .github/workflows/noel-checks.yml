name: Noël checks
on:
  push:
    branches: [edition-noel, livraison-v3]
  pull_request:
permissions:
  contents: read
jobs:
  noel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Original mechanics and Christmas browser checks
        run: |
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          npm run test:noel
      - uses: actions/upload-artifact@v4
        with:
          name: defi-boreal-noel-tests
          path: |
            artifacts/noel/
            artifacts/noel-home/
          retention-days: 30
