name: Expedition demo
on:
  push:
    branches: [preview/expeditions-v3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/expeditions.test.cjs
      - run: python3 scripts/build-expedition-demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: defi-boreal-expeditions-essai
          path: work/expedition-demo/
          retention-days: 30
