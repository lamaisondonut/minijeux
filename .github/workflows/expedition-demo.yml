name: Expedition demo
on:
  push:
    branches: [preview/expeditions-v3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: node --test tests/expeditions.test.cjs tests/obstacles-regression.test.cjs
      - run: python3 scripts/build-expedition-demo.py
      - run: npx playwright install --with-deps chromium
      - name: Browser obstacle and expedition checks
        run: |
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tests/expeditions-browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: defi-boreal-expeditions-essai
          path: work/expedition-demo/
          retention-days: 30
